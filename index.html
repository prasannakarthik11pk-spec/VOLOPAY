<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoF PulseDesk — Community CRM</title>
<style>
:root{--ink:#172033;--muted:#687386;--line:#e5e9f0;--bg:#f6f8fc;--card:#fff;--accent:#6b4eff;--soft:#f0edff;--green:#14845b;--amber:#a96500;--red:#ad3c46}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,Arial}
header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.logo{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}.logo b{font-size:18px}.logo span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 72px)}aside{background:#fff;border-right:1px solid var(--line);padding:20px 14px}aside small{color:#9aa3b1;padding:0 10px;text-transform:uppercase;font-size:10px}
nav button{display:block;width:100%;border:0;background:none;text-align:left;padding:11px 12px;margin:4px 0;border-radius:9px;color:#4e596c;cursor:pointer}nav button:hover,nav button.on{background:var(--soft);color:#4c35c7;font-weight:700}
main{max-width:1450px;width:100%;padding:28px;margin:auto}.view{display:none}.view.on{display:block}
h1,h2,h3,p{margin-top:0}h2{font-size:22px;margin-bottom:5px}.lead{color:var(--muted);font-size:12px;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px}.card strong{font-size:27px}.card label{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.row{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:16px}.panel h3{font-size:14px;margin-bottom:13px}
table{width:100%;border-collapse:collapse}th{font-size:10px;text-transform:uppercase;color:#87909e;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}td{padding:11px 8px;border-bottom:1px solid #eef1f5;font-size:12px;vertical-align:top}.muted{color:var(--muted);font-size:11px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700}.new{background:#e9efff;color:#425fb2}.active{background:#e6f7ef;color:#187052}.high{background:#def6ec;color:#08704b}.risk{background:#fff0d9;color:#965900}.dormant{background:#f9e4e7;color:#a23b45}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid #d9dee8;border-radius:8px;padding:9px 10px;background:#fff;font:inherit;font-size:12px}.toolbar input{min-width:280px}.btn{border:1px solid #dce1e9;background:#fff;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn + .btn{margin-left:5px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#586273}.full{grid-column:1/-1}.form textarea{min-height:85px}
.modal{display:none;position:fixed;inset:0;background:#10172888;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:#fff;width:min(820px,100%);max-height:90vh;overflow:auto;border-radius:15px;padding:22px}
.ai{background:#f3f1ff;border:1px solid #ddd6ff;border-radius:10px;padding:13px;line-height:1.55;font-size:12px}
.kicker{font-size:10px;color:#7b8494;text-transform:uppercase;letter-spacing:.06em}.notice{padding:12px;border-radius:9px;background:#f8fafc;border:1px solid var(--line);font-size:12px;line-height:1.5}
ul,ol{padding-left:20px}li{margin:7px 0;font-size:12px;line-height:1.5}
@media(max-width:950px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.cards{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="logo"><div class="mark">F</div><div><b>PulseDesk</b><span>Friends of Finance · community activity CRM</span></div></div><button class="btn" onclick="resetDemo()">Reset demo</button></header>
<div class="shell"><aside><small>Workspace</small><nav id="nav">
<button class="on" data-v="home">◈ Community pulse</button><button data-v="people">♙ Member directory</button><button data-v="follow">⚑ Follow-up queue</button><button data-v="new">✦ New arrivals</button><button data-v="high">↗ Highly engaged</button><button data-v="risk">! Needs attention</button><button data-v="guide">? Guide & QA</button></nav></aside>
<main><section id="home" class="view on"></section><section id="people" class="view"></section><section id="follow" class="view"></section><section id="new" class="view"></section><section id="high" class="view"></section><section id="risk" class="view"></section><section id="guide" class="view"></section></main></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<script src="data.js"></script><script>
const KEY="pulsedesk-demo-v2";let db=JSON.parse(localStorage.getItem(KEY)||"null")||JSON.parse(JSON.stringify(demoSeed));const TODAY=new Date("2026-08-17T12:00:00");
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const member=id=>db.members.find(x=>x.id===id), acts=id=>db.activities.filter(x=>x.memberId===id);
const age=d=>Math.floor((TODAY-new Date(d+"T12:00:00"))/86400000);
const last=id=>{let a=acts(id);return a.length?Math.min(...a.map(x=>age(x.date))):999};
function state(m){let j=age(m.joined),n=acts(m.id).filter(x=>age(x.date)<=30).length,l=last(m.id);if(j<=5)return"Newly joined";if(l>=21||n===0)return"Dormant";if(l>=10)return"At risk";if(n>=6)return"Highly active";return"Active"}
function badge(s){let c={"Newly joined":"new","Highly active":"high","At risk":"risk","Dormant":"dormant","Active":"active"}[s];return`<span class="badge ${c}">${s}</span>`}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function rows(ms,actions=true){if(!ms.length)return`<div class="notice">No members match this view.</div>`;return`<table><thead><tr><th>Member</th><th>Space</th><th>State</th><th>30d</th><th>Owner</th>${actions?"<th></th>":""}</tr></thead><tbody>${ms.map(m=>`<tr><td><b>${esc(m.name)}</b><br><span class="muted">${esc(m.role)} · ${esc(m.company)}</span></td><td>${esc(m.space)}</td><td>${badge(state(m))}</td><td>${acts(m.id).filter(x=>age(x.date)<=30).length}</td><td>${esc(m.owner)}</td>${actions?`<td><button class="btn" onclick="openPerson(${m.id})">Open</button></td>`:""}</tr>`).join("")}</tbody></table>`}
function renderHome(){let cs={};db.members.forEach(m=>cs[state(m)]=(cs[state(m)]||0)+1);let recent=[...db.activities].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8),need=db.members.filter(m=>["At risk","Dormant"].includes(state(m)));document.querySelector("#home").innerHTML=`
<h2>Community pulse</h2><div class="lead">A fictional activity-only workspace for community managers. Commercial intent is intentionally outside these scores.</div>
<div class="cards">${["Newly joined","Active","Highly active","At risk","Dormant"].map(s=>`<div class="card"><strong>${cs[s]||0}</strong><label>${s}</label></div>`).join("")}</div>
<div class="row"><div class="panel"><h3>Latest community activity</h3><table><thead><tr><th>Date</th><th>Member</th><th>Activity</th><th>Space</th></tr></thead><tbody>${recent.map(a=>`<tr><td>${a.date}</td><td><b>${esc(member(a.memberId).name)}</b></td><td>${esc(a.type)}</td><td>${esc(a.space)}</td></tr>`).join("")}</tbody></table></div>
<div class="panel"><h3>Manager queue</h3>${need.length?need.map(m=>`<div class="notice" style="margin-bottom:8px"><b>${esc(m.name)}</b> ${badge(state(m))}<br><span class="muted">${esc(m.nextAction)} · owner ${esc(m.owner)}</span></div>`).join(""):"<div class=notice>Nothing currently needs review.</div>"}</div></div>`}
function renderPeople(){document.querySelector("#people").innerHTML=`<h2>Member directory</h2><div class="lead">Edit profile ownership, log activity, and inspect the full history for any fictional member.</div><div class="toolbar"><input id="q" placeholder="Search member, company, role or space"><select id="stateFilter"><option>All states</option><option>Newly joined</option><option>Active</option><option>Highly active</option><option>At risk</option><option>Dormant</option></select><button class="btn primary" onclick="editPerson()">+ Add member</button></div><div class="panel" id="peopleTable"></div>`;q.oninput=filterPeople;stateFilter.onchange=filterPeople;filterPeople()}
function filterPeople(){let q=(document.querySelector("#q")?.value||"").toLowerCase(),f=document.querySelector("#stateFilter")?.value||"All states";let ms=db.members.filter(m=>(!q||[m.name,m.company,m.role,m.space].join(" ").toLowerCase().includes(q))&&(f==="All states"||state(m)===f));document.querySelector("#peopleTable").innerHTML=rows(ms)}
function renderFollow(){let ms=db.members.filter(m=>["At risk","Dormant"].includes(state(m)));document.querySelector("#follow").innerHTML=`<h2>Follow-up queue</h2><div class="lead">A review queue, not an automated outreach list. Every next action requires a human decision.</div><div class="panel">${ms.map(m=>`<div class="notice" style="margin-bottom:10px"><b>${esc(m.name)}</b> ${badge(state(m))}<br><span class="muted">${last(m.id)===999?"No activity":last(m.id)+" days since last activity"} · ${acts(m.id).filter(a=>age(a.date)<=30).length} activities in 30d</span><br><b>Next action:</b> ${esc(m.nextAction)} · <b>Owner:</b> ${esc(m.owner)}<br><button class="btn" onclick="openPerson(${m.id})" style="margin-top:8px">Review history</button></div>`).join("")||"<div class=notice>Queue is clear.</div>"}</div>`}
function focus(id,title,desc,kind){let ms=db.members.filter(m=>state(m)===kind);document.querySelector("#"+id).innerHTML=`<h2>${title}</h2><div class="lead">${desc}</div><div class="panel">${rows(ms,false)}</div>`}
function renderGuide(){document.querySelector("#guide").innerHTML=`<h2>Guide & QA</h2><div class="lead">Short operating notes for the evaluator and community manager.</div><div class="panel"><h3>Tool & data</h3><p class="muted">Custom HTML/CSS/JavaScript. Fifteen fictional members and fictional activities are bundled in <b>data.js</b>. Changes persist in browser localStorage.</p><h3>Activity-state rules</h3><ul><li><b>Newly joined:</b> joined 0–5 days ago.</li><li><b>Dormant:</b> no activity in the last 30 days, or last activity is 21+ days old.</li><li><b>At risk:</b> last activity is 10–20 days old.</li><li><b>Highly active:</b> 6+ activities in the last 30 days.</li><li><b>Active:</b> recent activity that does not meet the other rules.</li></ul><h3>AI-assisted action</h3><p class="muted"><b>Simulated.</b> Member detail includes an “AI community coach” action. It summarizes recorded activity and suggests a relevant community space or low-pressure next step. It never sends a message, invents attributes, or treats activity as buying intent.</p><h3>Safeguards</h3><ul><li>All records are fictional.</li><li>Engagement state is separate from commercial signals.</li><li>Any suggested outreach needs human review.</li><li>No automatic messages or external API calls.</li></ul><h3>Testing steps</h3><ol><li>Open Member directory and search “systems”.</li><li>Filter to At risk, then inspect a member history.</li><li>Add an activity and confirm the 30-day count/state changes.</li><li>Edit owner and next action; return to Follow-up queue.</li><li>Add a fictional member and verify it appears in the directory.</li><li>Run the simulated AI coach and confirm it does not send anything.</li><li>Use Reset demo to restore the original test dataset.</li></ol></div>`}
function openPerson(id){let m=member(id),aa=[...acts(id)].sort((a,b)=>b.date.localeCompare(a.date));document.querySelector("#box").innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px"><div><div class=kicker>Member profile</div><h2 style="margin:4px 0">${esc(m.name)}</h2><div class=lead>${esc(m.role)} · ${esc(m.company)} · ${badge(state(m))}</div></div><button class=btn onclick=closeModal()>Close</button></div><div class=panel><b>Primary space:</b> ${esc(m.space)}<br><b>Owner:</b> ${esc(m.owner)}<br><b>Next action:</b> ${esc(m.nextAction)}<br><b>Joined:</b> ${m.joined}<br><b>30-day activity:</b> ${acts(id).filter(a=>age(a.date)<=30).length}</div><div class=panel><h3>Activity history</h3>${aa.length?`<table><thead><tr><th>Date</th><th>Type</th><th>Space</th><th>Note</th></tr></thead><tbody>${aa.map(a=>`<tr><td>${a.date}</td><td>${esc(a.type)}</td><td>${esc(a.space)}</td><td>${esc(a.text)}</td></tr>`).join("")}</tbody></table>`:"<div class=notice>No activity yet.</div>"}</div><div class=panel><h3>AI community coach <span class=muted>· simulated</span></h3><div id=ai class=ai>Generate a recommendation from recorded community activity only.</div><br><button class="btn primary" onclick=coach(${id})>Generate coach suggestion</button></div><div style="text-align:right"><button class=btn onclick=editPerson(${id})>Edit profile</button><button class="btn primary" onclick=addActivity(${id})>+ Log activity</button></div>`;modal.classList.add("open")}
function coach(id){let m=member(id),aa=acts(id),spaces=[...new Set(aa.map(a=>a.space))];let suggestion=state(m)==="Newly joined"?`Start with a simple welcome conversation in ${m.space}.`:state(m)==="Highly active"?`Consider a peer introduction or invite them to share a practical example in ${m.space}.`:["At risk","Dormant"].includes(state(m))?`Consider a low-pressure re-engagement prompt related to ${m.space}, after a human checks context.`:`Suggest a useful discussion prompt in ${m.space}.`;document.querySelector("#ai").innerHTML=`<b>Activity summary:</b> ${aa.length} recorded activities across ${esc(spaces.join(", ")||"no spaces")}.<br><br><b>Suggested next step:</b> ${suggestion}<br><br><span class=muted>Human review required. This is not a sales or buying-intent assessment.</span>`}
function addActivity(id){let m=member(id);document.querySelector("#box").innerHTML=`<div class=kicker>Log community activity</div><h2>${esc(m.name)}</h2><div class=form><label>Date<input id=ad type=date value=2026-08-17></label><label>Activity type<select id=at><option>Post</option><option>Comment</option><option>Like</option><option>Introduction</option><option>Resource view</option><option>Event</option></select></label><label>Space<select id=as>${["Say Hello","Ask Finance Peers","Finance Operations","Systems & Automation","Planning & Forecasting","Treasury Circle","Career Corner","Leadership Lounge","Water Cooler"].map(x=>`<option ${x===m.space?"selected":""}>${x}</option>`).join("")}</select></label><label class=full>Note<textarea id=ax placeholder="Describe the fictional community activity"></textarea></label></div><br><button class=btn onclick=openPerson(${id})>Cancel</button><button class="btn primary" onclick=saveActivity(${id})>Save activity</button>`}
function saveActivity(id){db.activities.push({memberId:id,date:ad.value,type:at.value,space:as.value,text:ax.value||"Community activity recorded."});save();closeModal();renderAll();openPerson(id)}
function editPerson(id){let m=id?member(id):{name:"",role:"",company:"",joined:"2026-08-17",space:"Say Hello",owner:"Kavya",nextAction:""};document.querySelector("#box").innerHTML=`<div class=kicker>${id?"Update":"Add"} member</div><h2>${id?"Edit member":"New fictional member"}</h2><div class=form><label>Name<input id=mn value="${esc(m.name)}"></label><label>Role<input id=mr value="${esc(m.role)}"></label><label>Company<input id=mc value="${esc(m.company)}"></label><label>Joined<input id=mj type=date value="${m.joined}"></label><label>Primary space<select id=ms>${["Say Hello","Ask Finance Peers","Finance Operations","Systems & Automation","Planning & Forecasting","Treasury Circle","Career Corner","Leadership Lounge","Water Cooler"].map(x=>`<option ${x===m.space?"selected":""}>${x}</option>`).join("")}</select></label><label>Owner<select id=mo>${["Kavya","Dev","Mira"].map(x=>`<option ${x===m.owner?"selected":""}>${x}</option>`).join("")}</select></label><label class=full>Next action<input id=nx value="${esc(m.nextAction)}"></label></div><br><button class=btn onclick=closeModal()>Cancel</button><button class="btn primary" onclick=savePerson(${id||0})>Save</button>`;modal.classList.add("open")}
function savePerson(id){let o={id:id||Math.max(...db.members.map(m=>m.id),0)+1,name:mn.value.trim(),role:mr.value.trim(),company:mc.value.trim(),joined:mj.value,space:ms.value,owner:mo.value,nextAction:nx.value.trim()};if(!o.name||!o.role||!o.company)return alert("Name, role and company are required.");if(id)Object.assign(member(id),o);else db.members.push(o);save();closeModal();renderAll()}
function closeModal(){modal.classList.remove("open")}function resetDemo(){if(confirm("Restore the original fictional dataset?")){localStorage.removeItem(KEY);location.reload()}}
function renderAll(){renderHome();renderPeople();renderFollow();focus("new","New arrivals","Members who joined within the last five days.","Newly joined");focus("high","Highly engaged","Members with six or more activities in the last 30 days.","Highly active");let ms=db.members.filter(m=>["At risk","Dormant"].includes(state(m)));document.querySelector("#risk").innerHTML=`<h2>Needs attention</h2><div class=lead>At-risk and dormant members grouped for human review.</div><div class=panel>${rows(ms)}</div>`;renderGuide()}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));document.getElementById(b.dataset.v).classList.add("on")});modal.onclick=e=>{if(e.target===modal)closeModal()};renderAll();
</script></body></html>
